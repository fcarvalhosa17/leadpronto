<script type="text/babel">
function LPButton({ children, variant = "default", size, type = "button", disabled, onClick, style }) {
  const [hover, setHover] = React.useState(false);
  const [pressed, setPressed] = React.useState(false);
  const h = size === "sm" ? 28 : 32;
  const fs = size === "sm" ? 13 : 14;
  const base = {
    display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
    height: h, padding: "0 14px", fontFamily: "var(--font-sans)", fontSize: fs, fontWeight: 500,
    borderRadius: "var(--radius-lg)", cursor: disabled ? "not-allowed" : "pointer",
    opacity: disabled ? 0.5 : 1, border: "none",
    transition: "background 120ms ease, transform 80ms ease",
    transform: pressed && !disabled ? "translateY(1px)" : "none",
    userSelect: "none", whiteSpace: "nowrap",
    ...style,
  };
  const vs = variant === "outline"
    ? { background: hover && !disabled ? "var(--neutral-100)" : "var(--neutral-0)", color: "var(--foreground)", border: "1px solid var(--border)" }
    : { background: pressed && !disabled ? "var(--orange-700)" : hover && !disabled ? "var(--orange-700)" : "var(--orange-600)", color: "#fff" };
  return (
    <button type={type} disabled={disabled} onClick={onClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => { setHover(false); setPressed(false); }}
      onMouseDown={() => setPressed(true)} onMouseUp={() => setPressed(false)}
      style={{ ...base, ...vs }}>{children}</button>
  );
}

function LPInput({ value, onChange, placeholder, type = "text", min, max, disabled, style }) {
  const [focus, setFocus] = React.useState(false);
  return (
    <input type={type} value={value} onChange={onChange} placeholder={placeholder}
      min={min} max={max} disabled={disabled}
      onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
      style={{
        height: 32, width: "100%", padding: "0 12px",
        fontFamily: "var(--font-sans)", fontSize: 14, color: "var(--foreground)",
        background: "var(--background)", border: `1px solid ${focus ? "var(--ring)" : "var(--input)"}`,
        borderRadius: "var(--radius-lg)", outline: "none",
        boxShadow: focus ? "var(--focus-ring)" : "none",
        transition: "border-color 120ms ease, box-shadow 120ms ease",
        ...style,
      }} />
  );
}

function LPCard({ children, style }) {
  return (
    <div style={{
      background: "var(--surface-card)", borderRadius: "var(--radius-xl)",
      boxShadow: "var(--ring-hairline), var(--shadow-sm)",
      padding: 16, display: "flex", flexDirection: "column", gap: 16,
      ...style,
    }}>{children}</div>
  );
}

// Make available globally like _ds_bundle does
Object.assign(window, {
  Button: LPButton,
  Input: LPInput,
  LeadProntoDesignSystem_48420d: { Button: LPButton, Input: LPInput, Card: LPCard },
  LeadProntoDesignSystem_48420d17: { Button: LPButton, Input: LPInput, Card: LPCard },
});
</script>

function scoreTone(score) {
  if (!score || score === 0) return "gray";
  if (score >= 80) return "green";
  if (score >= 60) return "yellow";
  return "red";
}
function scorePinColor(score) {
  if (score >= 80) return "#22c55e";
  if (score >= 60) return "#eab308";
  return "#ef4444";
}
function scoreBarColor(score) {
  if (score < 40) return "#22c55e";
  if (score < 70) return "#eab308";
  return "#ef4444";
}
function hostname(url) {
  if (!url) return null;
  return String(url).replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "");
}
function relTime(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return "agora";
  if (diff < 3600) return Math.floor(diff / 60) + "min atrás";
  if (diff < 86400) return Math.floor(diff / 3600) + "h atrás";
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

function LPSearchPage({ leads, searchState, searchError, onSearch, onOpenLead, isPolling }) {
  const { Button, LPSelect, LPLeadsTable, LPIcon } = window;
  const Icon = LPIcon;
  const Card = window.LeadProntoDesignSystem_48420d.Card;
  const Input = window.Input;

  const [nicho, setNicho] = React.useState("");
  const [regiao, setRegiao] = React.useState("");
  const [raio, setRaio] = React.useState(3);
  const [textInput, setTextInput] = React.useState("");
  const [debounced, setDebounced] = React.useState("");
  const [status, setStatus] = React.useState("todos");
  const [minScore, setMinScore] = React.useState("0");

  React.useEffect(() => {
    const t = setTimeout(() => setDebounced(textInput), 300);
    return () => clearTimeout(t);
  }, [textInput]);

  function submit(e) {
    e.preventDefault();
    onSearch({ nicho: nicho.trim(), regiao: regiao.trim(), raio });
  }

  const loading = searchState === "loading";

  const filtered = React.useMemo(() => {
    const q = debounced.trim().toLowerCase();
    return leads.filter((l) => {
      if (q && !(`${l.name} ${l.address || ""}`.toLowerCase().includes(q))) return false;
      if (status !== "todos" && l.qual !== status) return false;
      if (minScore !== "0" && (l.score || 0) < Number(minScore)) return false;
      return true;
    });
  }, [leads, debounced, status, minScore]);

  function exportCSV() {
    const cols = ["Empresa","Categoria","Site","Telefone","Endereço","Distância","Score","Status Qual","Status CRM","Rating","Reviews","Instagram","Próximo Contato"];
    const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const rows = filtered.map((l) => [
      l.name, l.category, l.siteUrl || "", l.phone || "", l.address || "",
      l.dist != null ? l.dist.toFixed(2) : "", l.score || "",
      (window.LP_QUAL_META[l.qual] || {}).label || l.qual,
      (window.LP_CRM_META[l.crm] || {}).label || l.crm,
      l.rating ?? "", l.reviews ?? "", l.instagram || "", l.nextContact || "",
    ].map(esc).join(","));
    const csv = "﻿" + [cols.map(esc).join(","), ...rows].join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

<script type="text/babel">
function LPCrmPage({ leads, onOpenLead }) {
  const { Button, LPSelect, LPLeadsTable, LPIcon } = window;
  const Icon = LPIcon;
  const Card = window.LeadProntoDesignSystem_48420d.Card;
  const Input = window.Input;

  const [busca, setBusca] = React.useState("all");
  const [textInput, setTextInput] = React.useState("");
  const [debounced, setDebounced] = React.useState("");
  const [status, setStatus] = React.useState("todos");
  const [crm, setCrm] = React.useState("todos");
  const [minScore, setMinScore] = React.useState("0");

  React.useEffect(() => {
    const t = setTimeout(() => setDebounced(textInput), 300);
    return () => clearTimeout(t);
  }, [textInput]);

  const searchMatch = (window.LP_SEARCHES.find((s) => s.id === busca) || window.LP_SEARCHES[0]).match;

  const filtered = React.useMemo(() => {
    const q = debounced.trim().toLowerCase();
    return leads.filter((l) => {
      if (!searchMatch(l)) return false;
      if (q && !(`${l.name} ${l.address || ""}`.toLowerCase().includes(q))) return false;
      if (status !== "todos" && l.qual !== status) return false;
      if (crm !== "todos" && l.crm !== crm) return false;
      if (minScore !== "0" && (l.score || 0) < Number(minScore)) return false;
      return true;
    });
  }, [leads, busca, debounced, status, crm, minScore]);

  function exportCSV() {
    const cols = ["Empresa","Categoria","Site","Telefone","Endereço","Distância","Score","Status Qual","Status CRM","Rating","Reviews","Instagram","Próximo Contato"];
    const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const rows = filtered.map((l) => [
      l.name, l.category, l.siteUrl || "", l.phone || "", l.address || "",
      l.dist != null ? l.dist.toFixed(2) : "", l.score || "",
      (window.LP_QUAL_META[l.qual] || {}).label || l.qual,
      (window.LP_CRM_META[l.crm] || {}).label || l.crm,
      l.rating ?? "", l.reviews ?? "", l.instagram || "", l.nextContact || "",
    ].map(esc).join(","));
    const csv = "﻿" + [cols.map(esc).join(","), ...rows].join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "leads_crm_leadpronto.csv";
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
      <div>
        <h1 style={{ fontSize: 26, fontWeight: 600, letterSpacing: "-0.02em" }}>CRM — Todos os leads</h1>
        <p style={{ fontSize: 14, color: "var(--muted-foreground)", marginTop: 4, maxWidth: 720 }}>
          Lista consolidada de todos os leads já coletados em qualquer busca. Filtre por busca, status de qualificação, status comercial ou score.
        </p>
      </div>
      <Card style={{ padding: "16px 0 0", gap: 0 }}>
        <div style={{ padding: "0 16px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
          <span style={{ fontSize: 15, fontWeight: 600, color: "var(--text-strong)" }}>Leads ({filtered.length})</span>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <LPSelect ariaLabel="Busca" value={busca} onChange={setBusca} style={{ width: 200 }}
              options={window.LP_SEARCHES.map((s) => ({ value: s.id, label: s.label }))} />
            <div style={{ position: "relative", width: 200 }}>
              <Icon name="search" size={14} color="var(--muted-foreground)"
                style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }} />
              <Input value={textInput} onChange={(e) => setTextInput(e.target.value)}
                placeholder="filtrar por nome/endereço" style={{ paddingLeft: 30 }} />
            </div>
            <LPSelect ariaLabel="Status de qualificação" value={status} onChange={setStatus} style={{ width: 140 }} options={[
              { value: "todos", label: "Todos status" },
              { value: "pendente", label: "Pendente" },
              { value: "sem_site", label: "Sem site" },
              { value: "analisado", label: "Analisado" },
              { value: "erro", label: "Erro" },
            ]} />
            <LPSelect ariaLabel="Status comercial" value={crm} onChange={setCrm} style={{ width: 140 }} options={[
              { value: "todos", label: "Todos CRM" },
              ...window.LP_CRM_COLUMNS.map((c) => ({ value: c.id, label: c.label })),
            ]} />
            <LPSelect ariaLabel="Score mínimo" value={minScore} onChange={setMinScore} style={{ width: 150 }} options={[
              { value: "0", label: "Score min: qualquer" },
              { value: "50", label: "Score min: 50" },
              { value: "70", label: "Score min: 70" },
              { value: "80", label: "Score min: 80" },
            ]} />
            <Button variant="outline" onClick={exportCSV} style={{ gap: 6 }}>
              <Icon name="download" size={15} /> Exportar CSV
            </Button>
          </div>
        </div>
        <LPLeadsTable leads={filtered} onOpenLead={onOpenLead} />
      </Card>
    </div>
  );
}
window.LPCrmPage = LPCrmPage;
</script>

<script type="text/babel">
function DrawerSection({ title, children }) {
  return (
    <div style={{ padding: "18px 20px", borderTop: "1px solid var(--border)" }}>
      <div style={{
        fontSize: 11, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase",
        color: "var(--muted-foreground)", marginBottom: 12,
      }}>{title}</div>
      {children}
    </div>
  );
}

function ActionLink({ href, icon, label, color, bg, border }) {
  const Icon = window.LPIcon;
  return (
    <a href={href} target="_blank" rel="noreferrer"
      style={{
        display: "inline-flex", alignItems: "center", gap: 6, height: 30, padding: "0 10px",
        fontSize: 13, fontWeight: 500, borderRadius: "var(--radius-lg)",
        color: color || "var(--foreground)", background: bg || "var(--background)",
        border: `1px solid ${border || "var(--border)"}`,
        transition: "background 120ms ease",
      }}
      onMouseEnter={(e) => (e.currentTarget.style.filter = "brightness(0.97)")}
      onMouseLeave={(e) => (e.currentTarget.style.filter = "none")}>
      <Icon name={icon} size={14} /> {label}
    </a>
  );
}

function ScoreSection({ lead }) {
  const { LPBoolPill, LPIcon, lpScoreBarColor } = window;
  const box = {
    background: "var(--surface-muted)", border: "1px solid var(--border)",
    borderRadius: "var(--radius-lg)", padding: 14,
  };
  const bar = (value, color, label, right) => (
    <div style={{ marginBottom: 4 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 5 }}>
        <span style={{ color: "var(--muted-foreground)" }}>{label}</span>
        <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>{right}</span>
      </div>
      <div style={{ height: 8, borderRadius: 999, background: "var(--neutral-200)", overflow: "hidden" }}>
        <div style={{ width: `${Math.max(0, Math.min(100, value))}%`, height: "100%", background: color, borderRadius: 999, transition: "width 300ms ease" }} />
      </div>
    </div>
  );

  const psi = lead.psi || {};
  const perfColor = psi.performance >= 90 ? "#22c55e" : psi.performance >= 50 ? "#eab308" : "#ef4444";

  return (
    <div style={box}>
      {bar(lead.score || 0, lpScoreBarColor(lead.score || 0), "Score total", `${lead.score || 0}/100`)}
      {lead.qual === "sem_site" && (
        <div style={{ fontSize: 12.5, color: "#a16207", marginTop: 10 }}>Sem site — score base 75 (oportunidade alta).</div>
      )}
      {lead.qual === "pendente" && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "var(--muted-foreground)", marginTop: 10 }}>
          <LPIcon name="loader" size={13} style={{ animation: "lp-spin 0.9s linear infinite" }} />
          Qualificação ainda não iniciada.
        </div>
      )}
      {lead.qual === "erro" && (
        <div style={{ fontSize: 12.5, color: "var(--destructive)", marginTop: 10 }}>{lead.qualError || "Falha ao qualificar este lead."}</div>
      )}
      {lead.qual === "analisado" && (
        <div style={{ marginTop: 14 }}>
          {bar(psi.performance || 0, perfColor, "PSI Performance", psi.performance ?? "—")}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 12 }}>
            {[
              { label: "HTTPS", value: psi.https },
              { label: "Mobile viewport", value: psi.mobile },
              { label: "Safe Browsing", value: psi.safeBrowsing, labels: ["Seguro", "Ameaça"] },
              { label: "LCP", raw: psi.lcp != null ? `${psi.lcp} ms` : null },
            ].map(({ label, value, raw, labels }) => (
              <div key={label} style={{
                display: "flex", alignItems: "center", justifyContent: "space-between",
                padding: "8px 10px", background: "var(--background)", border: "1px solid var(--border)",
                borderRadius: "var(--radius-md)", fontSize: 12,
              }}>
                <span style={{ color: "var(--muted-foreground)" }}>{label}</span>
                {raw !== undefined ? (
                  raw == null
                    ? <span style={{ color: "var(--muted-foreground)", fontFamily: "var(--font-mono)" }}>—</span>
                    : <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>{raw}</span>
                ) : (
                  <LPBoolPill value={value} labels={labels} />
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function LPLeadDrawer({ lead, onClose, onUpdate, onAddNote }) {
  const { LPScoreBadge, LPQualBadge, LPCrmBadge, LPRatingBadge, LPSelect, LPIcon, lpHostname } = window;
  const Icon = LPIcon;
  const [visible, setVisible] = React.useState(false);
  const [note, setNote] = React.useState("");

  React.useEffect(() => { requestAnimationFrame(() => setVisible(true)); }, []);

  const close = React.useCallback(() => {
    setVisible(false);
    setTimeout(onClose, 220);
  }, [onClose]);

  React.useEffect(() => {
    const h = (e) => { if (e.key === "Escape") close(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [close]);

  if (!lead) return null;
  const waNumber = lead.phone ? "55" + lead.phone.replace(/\D/g, "") : null;
  const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(lead.address || lead.name);

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60 }}>

        position: "absolute", inset: 0, background: "rgba(10,10,10,0.5)",

            <LPQualBadge status={lead.qual} />
            <LPCrmBadge status={lead.crm} />

                          <span style={{
                            width: 8, height: 8, borderRadius: 999, marginTop: 5, flexShrink: 0,
                            background: isNote ? "var(--blue-500)" : "var(--neutral-400)",
                          }} />
                          {i < timeline.length - 1 && <span style={{ width: 1.5, flex: 1, background: "var(--border)", marginTop: 4 }} />}
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                            <span style={{ ...window.lpToneStyle(isNote ? "blue" : "gray"), height: 18, fontSize: 11 }}>
                              {isNote ? "Nota" : "status_crm"}
                            </span>
                            <span style={{ fontSize: 11, color: "var(--muted-foreground)" }}>{window.lpRelTime(item.ts)}</span>
                          </div>
                          <div style={{ fontSize: 13, color: "var(--text-body)", lineHeight: 1.45 }}>{item.text}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </DrawerSection>
          <div style={{ height: 8 }} />
        </div>
      </aside>
    </div>
  );
}
window.LPLeadDrawer = LPLeadDrawer;
</script>

<script type="text/babel">
function KanbanCard({ lead, onOpen, onDragStart, onDragEnd, dragging }) {
  const { LPScoreBadge, LPQualBadge, LPIcon, lpHostname } = window;
  const Icon = LPIcon;
  return (
    <div draggable
      onDragStart={(e) => { e.dataTransfer.effectAllowed = "move"; onDragStart(lead.id); }}
      onDragEnd={onDragEnd}
      onClick={() => onOpen(lead.id)}
      style={{
        background: "var(--surface-card)", border: "1px solid var(--border)",
        borderRadius: "var(--radius-lg)", padding: 12, boxShadow: "var(--shadow-xs)",
        cursor: dragging ? "grabbing" : "grab", opacity: dragging ? 0.4 : 1,
        transition: "opacity 120ms ease, box-shadow 120ms ease",
        display: "flex", flexDirection: "column", gap: 8,
      }}
      onMouseEnter={(e) => (e.currentTarget.style.boxShadow = "var(--shadow-sm)")}
      onMouseLeave={(e) => (e.currentTarget.style.boxShadow = "var(--shadow-xs)")}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <span style={{ fontWeight: 600, fontSize: 13.5, color: "var(--text-strong)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {lead.name}
        </span>
        <LPScoreBadge score={lead.score} style={{ height: 18, minWidth: 30, fontSize: 11 }} />
      </div>
      {lead.category && (
        <div style={{ fontSize: 12, color: "var(--muted-foreground)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{lead.category}</div>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
        <LPQualBadge status={lead.qual} style={{ height: 18, fontSize: 11 }} />
        {lead.phone && <span style={{ fontSize: 11.5, color: "var(--muted-foreground)", fontFamily: "var(--font-mono)" }}>{lead.phone}</span>}
      </div>
      {lead.site && (
        <a href={lead.siteUrl} target="_blank" rel="noreferrer" draggable={false}
          onClick={(e) => e.stopPropagation()} onMouseDown={(e) => e.stopPropagation()}
          style={{ fontSize: 12, color: "var(--text-brand)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", display: "inline-flex", alignItems: "center", gap: 4 }}
          onMouseEnter={(e) => (e.currentTarget.style.textDecoration = "underline")}
          onMouseLeave={(e) => (e.currentTarget.style.textDecoration = "none")}>
          <Icon name="globe" size={11} /> {lpHostname(lead.siteUrl)}
        </a>
      )}
    </div>
  );
}

function LPKanbanPage({ leads, onOpenLead, onMoveCrm }) {
  const [loading, setLoading] = React.useState(true);
  const [dragId, setDragId] = React.useState(null);
  const [overCol, setOverCol] = React.useState(null);
  const cols = window.LP_CRM_COLUMNS;

  React.useEffect(() => { const t = setTimeout(() => setLoading(false), 500); return () => clearTimeout(t); }, []);

  if (loading) {
    return <div style={{ padding: "60px 0", textAlign: "center", color: "var(--muted-foreground)", fontSize: 14 }}>Carregando leads...</div>;
  }

  function drop(colId) {
    if (dragId) {
      const lead = leads.find((l) => l.id === dragId);
      if (lead && lead.crm !== colId) onMoveCrm(dragId, colId);
    }
    setDragId(null); setOverCol(null);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <h1 style={{ fontSize: 26, fontWeight: 600, letterSpacing: "-0.02em" }}>Kanban</h1>
        <p style={{ fontSize: 14, color: "var(--muted-foreground)", marginTop: 4 }}>Arraste os cards entre as colunas para atualizar o status comercial.</p>
      </div>
      <div style={{ display: "flex", gap: 16, overflowX: "auto", paddingBottom: 12 }}>
        {cols.map((col) => {
          const items = leads.filter((l) => l.crm === col.id);
          const isOver = overCol === col.id;
          return (
            <div key={col.id}
              onDragOver={(e) => { e.preventDefault(); setOverCol(col.id); }}
              onDragLeave={(e) => { if (e.currentTarget === e.target) setOverCol(null); }}
              onDrop={() => drop(col.id)}
              style={{
                width: 288, flexShrink: 0, background: "var(--surface-muted)",
                border: `1.5px solid ${isOver ? "var(--orange-500)" : "transparent"}`,
                borderRadius: "var(--radius-xl)", padding: 12,
                transition: "border-color 150ms ease, background 150ms ease",
                display: "flex", flexDirection: "column", gap: 10,
                alignSelf: "flex-start", maxHeight: "calc(100vh - 220px)",
              }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 2px" }}>
                <span style={{ fontSize: 13.5, fontWeight: 600, color: "var(--text-strong)" }}>{col.label}</span>
                <span style={{
                  minWidth: 22, height: 20, padding: "0 6px", display: "inline-flex", alignItems: "center", justifyContent: "center",
                  background: "var(--neutral-200)", color: "var(--muted-foreground)", fontFamily: "var(--font-mono)",
                  fontSize: 12, fontWeight: 600, borderRadius: "var(--radius-sm)",
                }}>{items.length}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, overflowY: "auto", minHeight: 40 }}>
                {items.length === 0 ? (
                  <div style={{ border: "1.5px dashed var(--border)", borderRadius: "var(--radius-lg)", padding: "18px", textAlign: "center", fontSize: 12.5, color: "var(--muted-foreground)" }}>Vazio</div>
                ) : (
                  items.map((l) => (
                    <KanbanCard key={l.id} lead={l} dragging={dragId === l.id}
                      onOpen={onOpenLead} onDragStart={setDragId}
                      onDragEnd={() => { setDragId(null); setOverCol(null); }} />
                  ))
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
window.LPKanbanPage = LPKanbanPage;
</script>

<script type="text/babel">
function LPMapPage({ leads, onOpenLead }) {
  const { LPSelect, LPIcon } = window;
  const LP_SEARCHES = window.LP_SEARCHES;
  const mapRef = React.useRef(null);
  const layerRef = React.useRef(null);
  const openRef = React.useRef(onOpenLead);
  openRef.current = onOpenLead;

  const [busca, setBusca] = React.useState("all");
  const [minScore, setMinScore] = React.useState("0");

  const searchMatch = (LP_SEARCHES.find((s) => s.id === busca) || LP_SEARCHES[0]).match;
  const filtered = leads.filter((l) => searchMatch(l) && (l.score || 0) >= Number(minScore));
  const withCoords = filtered.filter((l) => l.lat != null && l.lng != null);

  React.useEffect(() => {
    if (!window.L || mapRef.current) return;
    const map = window.L.map("lp-map", { zoomControl: true, scrollWheelZoom: true }).setView([-23.589, -46.634], 13);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap",
    }).addTo(map);
    layerRef.current = window.L.layerGroup().addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  React.useEffect(() => {
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer || !window.L) return;
    layer.clearLayers();
    withCoords.forEach((l) => {
      const color = window.lpScorePinColor(l.score || 0);
      const marker = window.L.circleMarker([l.lat, l.lng], { radius: 9, color, weight: 2, fillColor: color, fillOpacity: 0.6 });
      const el = document.createElement("div");
      el.style.minWidth = "180px";
      el.innerHTML = `<div style="font-family:var(--font-sans);">
        <div style="font-weight:600;font-size:14px;color:#0a0a0a;">${l.name}</div>
        <div style="font-size:12px;color:#737373;margin-bottom:6px;">${l.category}</div>
        <div style="font-size:12px;margin-bottom:4px;">Score: <b style="font-family:var(--font-mono);">${l.score || "—"}</b></div>
        ${l.site ? `<a href="${l.siteUrl}" target="_blank" rel="noreferrer" style="font-size:12px;color:#ea580c;text-decoration:underline;">${window.lpHostname(l.siteUrl)}</a><br/>` : ""}
      </div>`;
      const btn = document.createElement("button");
      btn.textContent = "Ver detalhes";
      btn.style.cssText = "margin-top:8px;height:28px;padding:0 10px;border:none;border-radius:8px;background:#ea580c;color:#fff;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-sans);";
      btn.onclick = () => { map.closePopup(); openRef.current(l.id); };
      el.appendChild(btn);
      marker.bindPopup(el);
      marker.addTo(layer);
    });
    if (withCoords.length) {
      const lat = withCoords.reduce((a, l) => a + l.lat, 0) / withCoords.length;
      const lng = withCoords.reduce((a, l) => a + l.lng, 0) / withCoords.length;
      map.setView([lat, lng], map.getZoom() || 13);
    }
  }, [busca, minScore, leads]);

  const dot = (c) => ({ display: "inline-block", width: 9, height: 9, borderRadius: 999, background: c, marginRight: 5 });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <h1 style={{ fontSize: 26, fontWeight: 600, letterSpacing: "-0.02em" }}>Mapa de leads</h1>
        <p style={{ fontSize: 14, color: "var(--muted-foreground)", marginTop: 4 }}>
          {withCoords.length} de {filtered.length} leads com coordenadas.
        </p>
      </div>
      <div style={{
        display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap",
        background: "var(--surface-card)", border: "1px solid var(--border)",
        borderRadius: "var(--radius-xl)", padding: 14, boxShadow: "var(--shadow-xs)",
      }}>
        <LPSelect ariaLabel="Busca" value={busca} onChange={setBusca} style={{ width: 230 }}
          options={LP_SEARCHES.map((s) => ({ value: s.id, label: s.label }))} />
        <LPSelect ariaLabel="Score mínimo" value={minScore} onChange={setMinScore} style={{ width: 160 }} options={[
          { value: "0", label: "Score min: qualquer" },
          { value: "50", label: "Score min: 50" },
          { value: "70", label: "Score min: 70" },
          { value: "80", label: "Score min: 80" },
        ]} />
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 16, fontSize: 12.5, color: "var(--muted-foreground)" }}>
          <span><span style={dot("#22c55e")} />Score ≥ 80</span>
          <span><span style={dot("#eab308")} />60–79</span>
          <span><span style={dot("#ef4444")} />&lt; 60</span>
        </div>
      </div>
      <div style={{ position: "relative", borderRadius: "var(--radius-xl)", overflow: "hidden", border: "1px solid var(--border)", boxShadow: "var(--shadow-xs)" }}>
        <div id="lp-map" style={{ height: 600, width: "100%", background: "var(--surface-muted)" }} />
        {withCoords.length === 0 && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "var(--surface-card)" }}>
            <div style={{ border: "1.5px dashed var(--border)", borderRadius: "var(--radius-lg)", padding: "24px 32px", fontSize: 14, color: "var(--muted-foreground)" }}>
              Nenhum lead com coordenadas para exibir.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
window.LPMapPage = LPMapPage;
</script>

<script type="text/babel">
function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div style={{
      position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 80,
      background: "var(--neutral-900)", color: "var(--neutral-50)", fontSize: 13, fontWeight: 500,
      padding: "10px 16px", borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-lg)",
      display: "flex", alignItems: "center", gap: 8,
    }}>
      <window.LPIcon name="checkCircle" size={15} color="var(--green-500)" />
      {msg}
    </div>
  );
}

function App() {
  const [page, setPage] = React.useState("busca");
  const [leads, setLeads] = React.useState(() => window.LP_RAW_LEADS.map((l) => ({ ...l })));
  const [searchState, setSearchState] = React.useState("idle");
  const [searchError, setSearchError] = React.useState(null);
  const [openId, setOpenId] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const toastTimer = React.useRef(null);

  function flash(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }

  function onSearch({ nicho, regiao, raio }) {
    if (!nicho || !regiao) {
      setSearchError("informe nicho e região para iniciar a busca.");
      return;
    }
    setSearchError(null);
    setSearchState("loading");
    setTimeout(() => setSearchState("done"), 2200);
  }

  function updateLead(id, patch) {
    const { _activity, ...rest } = patch;
    setLeads((prev) => prev.map((l) => {
      if (l.id !== id) return l;
      const next = { ...l, ...rest };
      if (_activity) next.timeline = [...(l.timeline || []), { type: "status_crm", ts: new Date().toISOString(), text: _activity }];
      return next;
    }));
    if (_activity) flash(_activity);
  }

  function addNote(id, text) {
    setLeads((prev) => prev.map((l) => l.id === id
      ? { ...l, timeline: [...(l.timeline || []), { type: "nota", ts: new Date().toISOString(), text }] }
      : l));
    flash("Nota adicionada");
  }

  function moveCrm(id, status) {
    updateLead(id, { crm: status, _activity: `Status alterado para ${window.LP_CRM_META[status].label}` });
  }

  const pendingCount = leads.filter((l) => l.qual === "pendente").length;
  const isPolling = searchState === "done" && pendingCount > 0;

  React.useEffect(() => {
    if (!isPolling) return;
    const t = setTimeout(() => {
      setLeads((prev) => {
        const idx = prev.findIndex((l) => l.qual === "pendente");
        if (idx === -1) return prev;
        const perf = 35 + Math.floor(Math.random() * 58);
        const lcp = 1600 + Math.floor(Math.random() * 3200);
        const next = [...prev];
        next[idx] = {
          ...next[idx], qual: "analisado",
          score: Math.max(20, Math.min(96, Math.round(perf * 0.85 + 14))),
          psi: { https: true, mobile: perf > 48, safeBrowsing: Math.random() > 0.12, lcp, performance: perf },
        };
        return next;
      });
    }, 2600);
    return () => clearTimeout(t);
  }, [isPolling, pendingCount]);

  const openLead = leads.find((l) => l.id === openId) || null;

  return (
    <div style={{ minHeight: "100vh", background: "var(--background)" }}>
      <window.LPHeader page={page} onNavigate={setPage} />
      <main style={{ maxWidth: 1280, margin: "0 auto", padding: "32px 24px 64px" }}>
        {page === "busca" && (
          <window.LPSearchPage leads={leads} searchState={searchState} searchError={searchError}
            onSearch={onSearch} onOpenLead={setOpenId} isPolling={isPolling} />
        )}
        {page === "crm" && <window.LPCrmPage leads={leads} onOpenLead={setOpenId} />}
        {page === "kanban" && <window.LPKanbanPage leads={leads} onOpenLead={setOpenId} onMoveCrm={moveCrm} />}
        {page === "mapa" && <window.LPMapPage leads={leads} onOpenLead={setOpenId} />}
      </main>
      {openLead && (
        <window.LPLeadDrawer lead={openLead} onClose={() => setOpenId(null)}
          onUpdate={(patch) => updateLead(openLead.id, patch)}
          onAddNote={(text) => addNote(openLead.id, text)} />
      )}
      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
